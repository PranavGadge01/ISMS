name: One-time frontend lockfile regeneration

on:
  push:
    branches:
      - codex/isms-full-system-implementation
    paths:
      - docs/.regenerate-pnpm-lock-trigger

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/isms-full-system-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - name: Rebuild complete lockfile from package.json
        working-directory: frontend
        run: |
          rm -f pnpm-lock.yaml
          pnpm install
          pnpm run build
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- frontend/pnpm-lock.yaml; then
            echo "Lockfile did not change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml
          git commit -m "Regenerate complete frontend pnpm lockfile"
          git push origin HEAD:codex/isms-full-system-implementation
