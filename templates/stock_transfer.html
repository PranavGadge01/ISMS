{% extends 'base.html' %}{% block title %}Transfer stock{% endblock %}{% block content %}<a class="back-link" href="{{ url_for('main.stock_page') }}">← Stock</a><div class="page-heading"><div><span class="eyebrow">INVENTORY CONTROL</span><h1>Transfer stock</h1></div></div><div class="form-card"><form method="post" onsubmit="return confirm('Complete this stock transfer?')"><label class="form-label">Product</label><select class="form-select mb-3" name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>{% endfor %}</select><div class="row"><div class="col-md-5"><label class="form-label">From warehouse</label><select class="form-select mb-3" name="from_warehouse_id" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">To warehouse</label><select class="form-select mb-3" name="to_warehouse_id" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div><div class="col-md-2"><label class="form-label">Quantity</label><input class="form-control mb-3" type="number" name="quantity" min="1" required></div></div><button class="btn btn-primary">Transfer</button></form></div>{% endblock %}
