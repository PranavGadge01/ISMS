{% extends 'base.html' %}{% block content %}<h1 class="h2">Login log</h1><div class="table-responsive"><table class="table"><thead><tr><th>Timestamp</th><th>Username</th><th>Result</th><th>IP address</th></tr></thead><tbody>{% for item in logs %}<tr><td>{{ item.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ item.username }}</td><td>{{ 'Success' if item.success else 'Failure' }}</td><td>{{ item.ip_address }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
