{% extends 'base.html' %}{% block content %}<a class="back-link" href="{{ url_for('main.suppliers') }}">← Suppliers</a><div class="page-heading"><h1>Edit supplier</h1></div><div class="form-card"><form method="post"><div class="row">{% for field,label in [('name','Supplier name'),('contact_person','Contact person'),('phone','Phone'),('email','Email'),('gstin','GSTIN'),('payment_terms','Payment terms'),('address','Address')] %}<div class="col-md-6 mb-3"><label class="form-label">{{ label }}</label><input class="form-control" name="{{ field }}" value="{{ supplier|attr(field) or '' }}" {% if field=='name' %}required{% endif %}></div>{% endfor %}</div><button class="btn btn-primary">Save supplier</button></form></div>{% endblock %}
