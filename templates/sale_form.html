{% extends 'base.html' %}{% block content %}<h1 class="h2">Record a sale</h1><form method="post" class="col-lg-9"><input type="hidden" name="idempotency_key" value="{{ idempotency_key }}"><label class="form-label">Barcode / SKU</label><input id="sku-scan" class="form-control mb-3" placeholder="Scan barcode or type SKU and press Enter" autocomplete="off"><label class="form-label">Warehouse</label><select name="warehouse_id" class="form-select mb-3" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select><div id="sale-lines">{% for i in range(4) %}<div class="row g-2 mb-2"><div class="col-md-8"><select name="product_id" class="form-select"><option value="">Choose product</option>{% for p in products %}<option value="{{ p.id }}" data-sku="{{ p.sku|lower }}">{{ p.sku }} · {{ p.name }} — ₹{{ p.selling_price }}</option>{% endfor %}</select></div><div class="col-md-4"><input class="form-control" name="quantity" type="number" min="0" value="0" placeholder="Qty"></div></div>{% endfor %}</div><div class="row g-2 mt-3"><div class="col-md-4"><input class="form-control" type="number" min="0" step=".01" name="discount" value="0" placeholder="Discount ₹"></div><div class="col-md-4"><select name="payment_method" class="form-select" required><option>Cash</option><option>Card</option><option>UPI</option></select></div><div class="col-md-4"><input class="form-control" name="customer_name" placeholder="Customer"></div><div class="col-md-4"><input class="form-control" name="customer_phone" placeholder="Phone"></div></div><button class="btn btn-primary mt-3">Complete sale</button></form><p class="text-muted">Tax and maximum discount are calculated using Settings. Stock is validated before saving.</p>{% endblock %}{% block scripts %}<script>document.getElementById('sku-scan').addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();const sku=this.value.trim().toLowerCase();const selects=[...document.querySelectorAll('select[name="product_id"]')];let target=selects.find(s=>[...s.options].some(o=>o.dataset.sku===sku));if(!target)target=selects.find(s=>!s.value);if(!target)return;const option=[...target.options].find(o=>o.dataset.sku===sku);if(!option){this.setCustomValidity('SKU not found');this.reportValidity();return}target.value=option.value;const row=target.closest('.row');const qty=row.querySelector('input[name="quantity"]');qty.value=Number(qty.value||0)+1;this.value='';this.setCustomValidity('');});</script>{% endblock %}
