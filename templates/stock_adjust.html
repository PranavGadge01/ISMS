{% extends 'base.html' %}{% block title %}Adjust stock{% endblock %}{% block content %}<a class="back-link" href="{{ url_for('main.stock_page') }}">← Stock</a><div class="page-heading"><div><span class="eyebrow">INVENTORY CONTROL</span><h1>Adjust stock</h1><p>Record a controlled increase or decrease with a reason.</p></div></div><div class="form-card"><form method="post" onsubmit="return confirm('Save this stock adjustment?')"><div class="mb-3"><label class="form-label">Product</label><select class="form-select" name="product_id" required>{% for p in products %}<option value="{{ p.id }}" {% if request.args.get('product_id',type=int)==p.id %}selected{% endif %}>{{ p.sku }} — {{ p.name }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Warehouse</label><select class="form-select" name="warehouse_id" required>{% for w in warehouses %}<option value="{{ w.id }}" {% if request.args.get('warehouse_id',type=int)==w.id %}selected{% endif %}>{{ w.name }}</option>{% endfor %}</select></div><div class="row"><div class="col-md-4 mb-3"><label class="form-label">Direction</label><select class="form-select" name="direction"><option>Increase</option><option>Decrease</option></select></div><div class="col-md-4 mb-3"><label class="form-label">Quantity</label><input class="form-control" type="number" name="quantity" min="1" required></div><div class="col-md-4 mb-3"><label class="form-label">Reason</label><select class="form-select" name="reason" required><option>Count Correction</option><option>Damage</option><option>Theft</option><option>Other</option><option>Opening Stock</option></select></div></div><div class="mb-3"><label class="form-label">Comment (optional)</label><input class="form-control" name="comment"></div><button class="btn btn-primary">Save adjustment</button></form></div>{% endblock %}
