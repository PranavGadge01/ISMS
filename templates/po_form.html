{% extends 'base.html' %}{% block content %}<h1 class="h2">Create purchase order</h1><form method="post" class="col-lg-9"><label class="form-label">Supplier</label><select class="form-select mb-3" name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select><div id="lines">{% for i in range(3) %}<div class="row g-2 mb-2"><div class="col-md-8"><select name="product_id" class="form-select"><option value="">Choose product</option>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} · {{ p.name }} (₹{{ p.cost_price }})</option>{% endfor %}</select></div><div class="col-md-4"><input name="quantity" class="form-control" type="number" min="0" value="0" placeholder="Quantity"></div></div>{% endfor %}</div><button class="btn btn-primary">Submit PO</button></form>{% endblock %}
