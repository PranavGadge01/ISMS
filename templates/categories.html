{% extends 'base.html' %}{% block content %}<h1 class="h2">Categories</h1><form method="post" class="row g-2 mb-4"><div class="col-md-4"><input class="form-control" name="name" required placeholder="Category name"></div><div class="col-md-4"><select class="form-select" name="parent_id"><option value="">Top-level category</option>{% for c in items %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-primary">Add category</button></div></form><ul>{% for c in items %}<li>{{ c.name }}{% if c.parent_id %} · subcategory of {{ c.parent.name if c.parent else '' }}{% endif %}</li>{% endfor %}</ul>{% endblock %}
