{% extends 'base.html' %}{% block content %}<h1 class="h2">Edit product</h1><form method="post" class="row g-3 col-lg-8"><div class="col-md-6"><label class="form-label">SKU (fixed)</label><input class="form-control" value="{{ p.sku }}" readonly></div><div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" name="name" value="{{ p.name }}" required></div><div class="col-md-6"><label class="form-label">Category</label><select class="form-select" name="category_id"><option value="">None</option>{% for c in categories %}<option value="{{ c.id }}" {% if p.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Unit</label><input class="form-control" name="unit" value="{{ p.unit }}"></div>{% for key,label in [('cost_price','Cost price'),('selling_price','Selling price'),('reorder_level','Reorder level'),('reorder_qty','Reorder quantity')] %}<div class="col-md-6"><label class="form-label">{{ label }}</label><input class="form-control" type="number" min="0" step=".01" name="{{ key }}" value="{{ p|attr(key) }}" required></div>{% endfor %}<div><button class="btn btn-primary">Save changes</button></div></form>{% endblock %}
