{% extends 'base.html' %}{% block content %}<a class="back-link" href="{{ url_for('main.categories') }}">← Categories</a><div class="page-heading"><h1>Edit category</h1></div><div class="form-card"><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ item.name }}" required><label class="form-label">Parent category</label><select class="form-select mb-3" name="parent_id"><option value="">None</option>{% for c in categories %}<option value="{{ c.id }}" {% if item.parent_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><button class="btn btn-primary">Save</button></form></div>{% endblock %}
